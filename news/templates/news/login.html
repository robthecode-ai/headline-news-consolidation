{% extends "news/base.html" %}

{% block title %}Log in | News{% endblock %}
{% block page_class %}auth-page{% endblock %}

{% block content %}
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">Log in</button>
    </form>
{% endblock %}
